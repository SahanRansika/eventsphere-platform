# ============================================================
# Eureka
# ============================================================

eureka.client.service-url.defaultZone=${EUREKA_URL:http://discovery-server:8761/eureka}

eureka.instance.prefer-ip-address=true


# ============================================================
# Actuator
# ============================================================

management.endpoints.web.exposure.include=health,info


# ============================================================
# Server
# ============================================================

server.port=8081


# ============================================================
# PostgreSQL
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/eventsphere_users}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:eventsphere_user}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:eventsphere_pass}


# ============================================================
# JPA
# ============================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ============================================================
# JWT
# ============================================================

jwt.secret=${JWT_SECRET:EventSphereDevSecret2026!LongKey32Characters}

jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}