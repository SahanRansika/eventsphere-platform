# ============================================================
# Server Configuration
# ============================================================
server.port=8081

# ============================================================
# Eureka Registration
# ============================================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://discovery-server:8761/eureka}
eureka.instance.prefer-ip-address=true

# ============================================================
# Actuator Endpoints
# ============================================================
management.endpoints.web.exposure.include=health,info

# ============================================================
# PostgreSQL Database Configuration
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/eventsphere_users}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:eventsphere_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:eventsphere_pass}

# ============================================================
# Hibernate / JPA Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# JWT Security Details
# ============================================================
jwt.secret=${JWT_SECRET:EventSphereDevSecret2026!LongKey32Characters}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}