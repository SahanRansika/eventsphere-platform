# ============================================================
# Eureka
# ============================================================

eureka.client.service-url.defaultZone=${EUREKA_URL:http://discovery-server:8761/eureka}

eureka.instance.prefer-ip-address=true


# ============================================================
# Actuator
# ============================================================

management.endpoints.web.exposure.include=health,info


# ============================================================
# Server
# ============================================================

server.port=8080


# ============================================================
# Gateway Discovery Locator
# ============================================================

spring.cloud.gateway.discovery.locator.enabled=false


# ============================================================
# User Service Routes
# ============================================================

spring.cloud.gateway.routes[0].id=user-service

spring.cloud.gateway.routes[0].uri=http://user-service:8081

spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**


# ============================================================
# Event Service Routes
# ============================================================

spring.cloud.gateway.routes[1].id=user-management-service
spring.cloud.gateway.routes[1].uri=http://user-service:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**


# ============================================================
# Event Service Routes
# ============================================================

spring.cloud.gateway.routes[2].id=event-service
spring.cloud.gateway.routes[2].uri=http://event-service:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/events/**


# ============================================================
# Booking Service Routes
# ============================================================

spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=http://booking-service:8083
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bookings/**


# ============================================================
# JWT
# ============================================================

jwt.secret=${JWT_SECRET:EventSphereDevSecret2026!LongKey32Characters}