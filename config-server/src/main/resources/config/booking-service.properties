# ============================================================
# Eureka
# ============================================================

eureka.client.service-url.defaultZone=${EUREKA_URL:http://discovery-server:8761/eureka}

eureka.instance.prefer-ip-address=true


# ============================================================
# Actuator
# ============================================================

management.endpoints.web.exposure.include=health,info


# ============================================================
# Booking Service
# ============================================================

server.port=8083


# ============================================================
# MongoDB
# ============================================================

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://eventsphere_user:eventsphere_pass@mongodb:27017/eventsphere_bookings?authSource=admin}

spring.data.mongodb.database=eventsphere_bookings


# ============================================================
# Gmail SMTP
# ============================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}

spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME:}

spring.mail.password=${MAIL_PASSWORD:}

spring.mail.protocol=smtp

spring.mail.default-encoding=UTF-8


# ============================================================
# SMTP
# ============================================================

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000

spring.mail.properties.mail.smtp.timeout=10000

spring.mail.properties.mail.smtp.writetimeout=10000